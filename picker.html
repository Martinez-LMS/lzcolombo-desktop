<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escolha o que compartilhar</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px; background: #10151f; color: #e9edf6;
    font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; user-select: none;
  }
  h1 { font-size: 15px; margin: 0 0 14px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-height: 420px; overflow-y: auto; }
  .src {
    border: 2px solid rgba(255,255,255,.08); border-radius: 10px; padding: 8px; cursor: pointer; background: #161c29;
    display: flex; flex-direction: column; gap: 6px; text-align: left;
  }
  .src:hover, .src:focus { border-color: #6f5bff; outline: none; }
  .src img { width: 100%; height: 84px; object-fit: contain; background: #000; border-radius: 6px; }
  .src span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { margin-top: 16px; text-align: right; }
  button.cancel {
    background: transparent; border: 1px solid rgba(255,255,255,.14); color: #e9edf6; border-radius: 8px;
    padding: 8px 16px; font: inherit; cursor: pointer;
  }
  button.cancel:hover { background: #161c29; }
</style>
</head>
<body>
  <h1>Escolha o que compartilhar</h1>
  <div class="grid" id="grid"></div>
  <div class="actions"><button class="cancel" id="cancel">Cancelar</button></div>
  <script>
    const grid = document.getElementById('grid');
    window.pickerAPI.onSources((sources) => {
      grid.replaceChildren(...sources.map((s) => {
        const b = document.createElement('button');
        b.className = 'src';
        const img = document.createElement('img');
        img.src = s.thumbnail;
        const span = document.createElement('span');
        span.textContent = s.name;
        b.append(img, span);
        b.onclick = () => window.pickerAPI.choose(s.id);
        return b;
      }));
    });
    document.getElementById('cancel').onclick = () => window.pickerAPI.cancel();
  </script>
</body>
</html>
